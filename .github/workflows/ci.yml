name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # No engines field or .nvmrc; the Dockerfile builds on node:22-alpine, so match it.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Typecheck + production build ("build": "tsc && vite build").
      # The "lint" script is NOT run: eslint isn't installed and there is no eslint config,
      # so it would fail on every PR. No test script exists yet.
      - name: Typecheck and build
        run: npm run build
